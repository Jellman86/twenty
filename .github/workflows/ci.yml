name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Secrets · full history and files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/scan-secrets.sh
  test:
    name: Tests · .NET, Svelte, Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: npm ci --prefix web && npm test --prefix web && npm run check --prefix web && npm run build --prefix web
      - run: dotnet restore Twenty.slnx --locked-mode
      # Non-vacuous evidence: refuses zero-match, skipped-as-passed, failed or source-changing runs.
      - run: python3 scripts/checkpoint.py dotnet --project Twenty.slnx --min-passed 1464 --timeout-seconds 3600 --output-dir "$RUNNER_TEMP/checkpoint-dotnet"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-test-evidence
          path: ${{ runner.temp }}/checkpoint-dotnet
          if-no-files-found: error
          retention-days: 14
      - run: python3 scripts/check_research_boundary.py
      - run: dotnet run --project src/Twenty.Data -c Release --no-restore -- validate fixtures/data/point-in-time.v1.json
      - run: dotnet run --project src/Twenty.Data -c Release --no-restore -- sec-inspect 1 fixtures/sec/submissions.synthetic.json
      - run: dotnet run --project src/Twenty.Data -c Release --no-restore -- ecb-inspect fixtures/fx/ecb.synthetic.xml --date 2024-04-02 --base USD --quote GBP
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uvx ruff check src/twenty tests/*.py scripts/*.py
  image:
    name: Image · smoke and publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [secrets, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg COMMIT="$GITHUB_SHA" -t ghcr.io/jellman86/twenty:dev -t ghcr.io/jellman86/twenty:sha-${GITHUB_SHA::12} .
      - name: Smoke test the built image
        env:
          # Disposable code for the throwaway smoke container only; real deployments set their own privately or read the log.
          TWENTY_SETUP_CODE: ci-smoke-setup-code
        run: |
          docker run --detach --name twenty-smoke --env TWENTY_SETUP_CODE --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,uid=1654,gid=1654 --cap-drop ALL --security-opt no-new-privileges:true --memory 512m --cpus 1 -p 127.0.0.1:18080:8080 ghcr.io/jellman86/twenty:dev
          trap 'docker logs twenty-smoke; docker rm -f twenty-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready; then break; fi
            sleep 1
          done
          python3 scripts/smoke.py http://127.0.0.1:18080
          docker exec twenty-smoke dotnet Twenty.Api.dll --health-check
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: |
          docker push ghcr.io/jellman86/twenty:dev
          docker push ghcr.io/jellman86/twenty:sha-${GITHUB_SHA::12}
